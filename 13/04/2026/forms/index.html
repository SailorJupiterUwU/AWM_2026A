<body>
    <h1>Registration Form</h1>

        <div>

            <input type="text" name="firsName" placeholder="Aqui va tu nombre">

        <div>
            <label for="lastsName">Last Name: *</label>
            <input type="text" name="lastName" placeholder="Aqui va tu apellido">
        </div>
        <div>
            <label for="email">Email: *</label>
            <input type="text" name="email" placeholder="Aqui va tu email">
        </div>
        <div>
            <label for="contra"> Password: *</label>
            <input type="password" name="contra" placeholder="Aqui va tu contraseña">
        </div>
        <div>
            <label for="contraConfi"> Password: *</label>

        </div>
        <div>
            <label for="fecha"> Birthday: *</label>
            <input type="date" name="fecha" placeholder="Aqui va tu fecha de nacimiento">
        </div>
        <div>
            <label for="gender"> Gender: *</label>
            
            <input type="radio" name="male" value="bold" id="bold">
            <label for="gender"> Male</label>
            <input type="radio" name="male" value="bold" id="bold">
            <label for="">Female</label>
            <input type="radio" name="male" value="bold" id="bold">
            <label for="">Non-Binary</label>
            <input type="radio" name="male" value="bold" id="bold">
            <label for="">I prefer not to answer</label>
        </div>
    </form>
</body>
